name: Release (Linux amd64)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux amd64 Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Build Frontend
        env:
          CI: ""
        run: make build-web RELEASE_VERSION="$RELEASE_VERSION"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Linux amd64 binary
        run: make build-linux-amd64 RELEASE_VERSION="$RELEASE_VERSION"

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          fail_on_unmatched_files: true
          files: |
            build/new-api-${{ env.RELEASE_VERSION }}
            build/checksums-linux.txt
            THIRD-PARTY-LICENSES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
